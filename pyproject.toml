[project]
name = "roamer-tracker"
version = "0.5.1"
description = "Always-on-top FireRed, LeafGreen and Emerald roaming Pokémon tracker"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[dependency-groups]
assets = [
    "Pillow>=10,<13",
]
dev = [
    "pre-commit>=4.6.1",
    "pyinstaller>=6.21.0",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
