name: Release native applications

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            artifact: RoamerTracker-Linux
          - os: windows-latest
            platform: Windows
            artifact: RoamerTracker-Windows
          - os: macos-latest
            platform: macOS
            artifact: RoamerTracker-macOS

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Qt system library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --python 3.11 --frozen

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build native application
        run: uv run pyinstaller --clean --noconfirm RoamerTracker.spec

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_dir="package/RoamerTracker-Linux"
          mkdir -p "$package_dir" release
          cp dist/RoamerTracker README.md LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -C package -czf release/RoamerTracker-Linux.tar.gz RoamerTracker-Linux

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "package/RoamerTracker-Windows"
          New-Item -ItemType Directory -Force $packageDir, "release" | Out-Null
          Copy-Item dist/RoamerTracker.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath release/RoamerTracker-Windows.zip

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package_dir="package/RoamerTracker-macOS"
          mkdir -p "$package_dir" release
          cp -R dist/RoamerTracker.app "$package_dir/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" release/RoamerTracker-macOS.zip

      - name: Upload native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Verify release version and prepare notes
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$tag_version" = "$project_version"
          awk -v version="$tag_version" '
            $0 ~ "^## \\[" version "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Roamer Tracker ${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$title" --notes-file release-notes.md
          fi
